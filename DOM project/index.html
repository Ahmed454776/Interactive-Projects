<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thatix Cooking</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <img src="./Images/logo.png" alt="Recipe App Logo" class="logo">
  <header style= "background-image:url('./Images/page-title.jpg');">
    <h1>Search Your Favorite Recipe</h1>
    <p>A handful of simple ingredients typify the fresh, vibrant flavors of global cooking</p>
  </header>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Search recipes...">
    <button onclick="searchRecipes()"><i class="fa-solid fa-magnifying-glass"></i></button>
  </div>

  <section class="recipes-section">
    <h2 class="recipes-title">Latest Recipes</h2>
    <div class="recipes-grid" id="recipesContainer">
      <!-- Recipes will be inserted here dynamically -->
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Recipe App. All rights reserved.</p>
  </footer>
  <script src="./javascript/app.js"></script>
</body>
</html>
